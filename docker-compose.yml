# Two ways to use this file:
#
#   docker compose up -d postgres redis        services only; run Django + worker on the host
#   docker compose up --build                  everything in containers (web on :8000)
#
# Uploads go to MinIO (S3 API). Web and worker share no disk, so `--scale worker=3`
# works. The worker gets a hard memory limit: an oversized upload OOM-kills the
# worker's job process; the web container never notices.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cellengine
      POSTGRES_PASSWORD: cellengine
      POSTGRES_DB: cellengine
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cellengine
      MINIO_ROOT_PASSWORD: cellengine-secret
    ports: ["9000:9000", "9001:9001"]        # 9001 = web console
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["sh", "-c", "python server/manage.py wait_for_services && python server/manage.py migrate --noinput && python server/manage.py ensure_bucket"]
    environment: &app_env
      DATABASE_URL: postgres://cellengine:cellengine@postgres:5432/cellengine
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-dev-secret-change-me}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      CELLENGINE_S3_BUCKET: cellengine-uploads
      CELLENGINE_S3_ENDPOINT: http://minio:9000
      CELLENGINE_S3_ACCESS_KEY: cellengine
      CELLENGINE_S3_SECRET_KEY: cellengine-secret
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: .
    ports: ["8000:8000"]
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M }

  worker:
    build: .
    # sweep_runs fails any run orphaned by a previous worker death; exec makes
    # rqworker PID 1 so SIGTERM reaches it for a graceful stop.
    command: ["sh", "-c", "python server/manage.py sweep_runs; exec python server/manage.py rqworker default"]
    environment:
      <<: *app_env
      CELLENGINE_ROLE: worker      # pre-import scanpy + JIT warmup at boot (api/apps.py)
      PYTHONFAULTHANDLER: "1"
    healthcheck:   # the image default curls :8000, which a worker does not serve
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
    volumes: ["numba:/var/cache/numba"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 2G }
    restart: unless-stopped

volumes:
  pgdata:
  minio:
  numba:
