# Local services only. The Django dev server and the worker run on the host:
#   docker compose up -d
#   python server/manage.py migrate && python server/manage.py runserver
#   python server/manage.py rqworker default
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cellengine
      POSTGRES_PASSWORD: cellengine
      POSTGRES_DB: cellengine
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
volumes:
  pgdata:
