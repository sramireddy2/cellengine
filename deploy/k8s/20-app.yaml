# Web tier + worker tier, same image, different commands and very different
# resource limits. This is the isolation story:
#
#   web     2 replicas, 512Mi limit, never imports scanpy, never opens a matrix
#   worker  1..N replicas, 2Gi limit each, does all the heavy lifting; an
#           oversized upload OOM-kills THAT job's process, the next poll of the
#           run reports it failed, web keeps serving
#
# Uploads live in object storage (15-minio.yaml), so web and worker share no
# volume and the worker can scale out (deploy/k8s-keda/).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: cellengine
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: cellengine:local
          imagePullPolicy: Always      # local tag never changes; re-pull from the daemon on each rebuild
          command: ["sh", "-c", "python server/manage.py wait_for_services && python server/manage.py migrate --noinput && python server/manage.py ensure_bucket"]
          envFrom:
            - configMapRef: { name: cellengine-config }
            - secretRef: { name: cellengine-secret }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cellengine
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: cellengine:local
          imagePullPolicy: Always      # local tag never changes; re-pull from the daemon on each rebuild
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: cellengine-config }
            - secretRef: { name: cellengine-secret }
          readinessProbe:
            httpGet: { path: /api/healthz/, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz/, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cellengine
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cellengine
spec:
  replicas: 1                           # KEDA overrides this when installed
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 1800   # let an in-flight run finish on rollout / scale-in
      containers:
        - name: worker
          image: cellengine:local
          imagePullPolicy: Always      # local tag never changes; re-pull from the daemon on each rebuild
          command: ["sh", "-c", "python server/manage.py sweep_runs; exec python server/manage.py rqworker default"]
          envFrom:
            - configMapRef: { name: cellengine-config }
            - secretRef: { name: cellengine-secret }
          env:
            # Pre-import the science stack and warm the JIT at boot (api/apps.py).
            - { name: CELLENGINE_ROLE, value: worker }
            # ONE thread per library, not "match the CPU limit". Two reasons, both measured:
            #  - GNU OpenMP (used by scikit-learn's kNN) is not fork-safe: a pool started by
            #    the warmup in the parent segfaults in every RQ work horse (signal 11).
            #  - BLAS/numba/OpenMP pools oversubscribe each other inside a small pod.
            # Scale with worker replicas, not threads: RQ runs one job per worker anyway.
            - { name: OMP_NUM_THREADS, value: "1" }
            - { name: OPENBLAS_NUM_THREADS, value: "1" }
            - { name: NUMBA_NUM_THREADS, value: "1" }
            # A segfault in a work horse leaves a Python traceback in the pod log.
            - { name: PYTHONFAULTHANDLER, value: "1" }
          volumeMounts:
            - { name: numba-cache, mountPath: /var/cache/numba }
            - { name: scratch, mountPath: /tmp }        # downloaded uploads + tar extraction
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }   # memory is the OOM boundary; one job = one core
      volumes:
        - name: numba-cache
          emptyDir: {}
        - name: scratch
          emptyDir: { sizeLimit: 2Gi }
