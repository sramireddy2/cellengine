# Scale the worker on queue depth. RQ queues are plain Redis lists, so KEDA's
# generic redis scaler works with no RQ-specific code:
#
#   kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.20.2/keda-2.20.2.yaml
#   kubectl apply -f deploy/k8s-keda/
#
# Semantics: target one queued job per worker. Three jobs waiting => three
# workers (up to max). KEDA hands the metric to a regular HPA, so scale-in
# follows the HPA's downscale stabilization (5 min by default), and a
# scaled-in pod gets terminationGracePeriodSeconds to finish its job.
# minReplicaCount stays 1: a scale-from-zero worker would pay the ~25 s JIT
# warmup on every first run.
#
# Trade-off to know: a new worker pays the ~25 s JIT warmup before its first
# job, so scale-out helps a burst of runs, not a single slow one.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: cellengine
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: redis
      metadata:
        address: redis.cellengine.svc.cluster.local:6379
        listName: rq:queue:default
        listLength: "1"
        activationListLength: "0"
