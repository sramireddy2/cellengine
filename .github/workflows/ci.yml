name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest (sqlite + fake redis + inline jobs)
        run: pytest -q
      - name: django check (production settings)
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only
          CELLENGINE_ENV: test
        run: python server/manage.py check --deploy --fail-level ERROR

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true          # buildx keeps the image in its cache unless told to load it
          tags: cellengine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "smoke: image boots and answers healthz in lite mode"
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e CELLENGINE_ENV=test -e DJANGO_DEBUG=1 cellengine:ci \
            sh -c "python server/manage.py migrate -v 0 && gunicorn config.wsgi:application --chdir server -b 0.0.0.0:8000"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/healthz/ && break; sleep 2; done
          curl -fsS http://localhost:8000/api/healthz/
          curl -fsS -o /dev/null http://localhost:8000/static/app.js     # whitenoise serves collectstatic output
          curl -fsS http://localhost:8000/api/auth/me/
          docker logs smoke | tail -20
